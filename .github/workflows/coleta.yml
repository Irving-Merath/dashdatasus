name: Coleta DATASUS

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira, 6h da manhã (Brasília)
  workflow_dispatch:      # cria o botão "Run workflow"
    inputs:
      base:
        description: "Base a coletar"
        type: choice
        default: sinasc
        options: [sinasc]

permissions:
  contents: write

concurrency: coleta-datasus

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB,
             PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-coleta.txt
      - run: python coletar.py --base ${{ inputs.base || 'sinasc' }} --uf ${{ matrix.uf }}
      - uses: actions/upload-artifact@v4
        with:
          name: saida-${{ matrix.uf }}
          path: saida/
          if-no-files-found: ignore
          retention-days: 3

  salvar:
    needs: coletar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-coleta.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: saida-*
          path: saida
          merge-multiple: true
      - run: python coletar.py --consolidar
      - run: |
          git config user.name "robo-coleta"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nenhum dado novo."
          else
            git commit -m "Atualiza dados ($(date +%F))"
            git pull --rebase
            git push
          fi
