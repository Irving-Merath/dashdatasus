name: Coleta DATASUS

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira, 6h da manhã (Brasília)
  workflow_dispatch:      # cria o botão "Run workflow"
    inputs:
      base:
        description: "Base a coletar"
        type: choice
        default: todas
        options: [todas, sinasc, sim, sih, sinan, cnes]

permissions:
  contents: write

concurrency: coleta-datasus

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        uf: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB,
             PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO,
             BR]   # BR = robô das bases nacionais (ex.: SINAN)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-coleta.txt
      # limite menor que o do job (350): se travar, sobra tempo para guardar
      # o que já foi coletado no passo seguinte
      - run: python coletar.py --base ${{ inputs.base || 'todas' }} --uf ${{ matrix.uf }}
        timeout-minutes: 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saida-${{ matrix.uf }}
          path: saida/
          if-no-files-found: ignore
          retention-days: 3

  salvar:
    needs: coletar
    if: always()
    runs-on: ubuntu-latest
    steps:
      # usa a versão MAIS RECENTE do repositório (e não a do momento em que
      # a coleta começou), para não brigar com o que foi salvo nesse meio-tempo
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-coleta.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: saida-*
          path: saida
          merge-multiple: true
      - run: python coletar.py --consolidar
      - run: |
          git config user.name "robo-coleta"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nenhum dado novo."
          else
            git commit -m "Atualiza dados ($(date +%F))"
            # se alguém salvou algo no meio-tempo, junta as versões; em caso de
            # conflito num arquivo de dados, vale o que o robô acabou de coletar
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            echo "::error::Não foi possível salvar os dados no repositório."
            exit 1
          fi
